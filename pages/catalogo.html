<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Turing Store | Catálogo</title>
  </head>
  <body class="d-flex flex-column min-vh-100" data-page="catalogo">
    <nav
      class="navbar navbar-expand-lg navbar-dark sticky-top"
      aria-label="Navegación principal"
    >
      <div class="container">
        <a class="navbar-brand" href="../index.html"
          ><img class="brand-logo" src="../assets/logo-turing.svg" alt="" />
          <span>Turing Store</span></a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Abrir menú de navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" data-page="inicio" href="../index.html"
                >Inicio</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-page="catalogo" href="catalogo.html"
                >Catálogo</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-page="producto" href="producto.html"
                >Producto</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-page="carrito" href="carrito.html"
                >Carrito</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-page="perfil" href="perfil.html"
                >Mi perfil</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-page="admin" href="admin.html"
                >Administración</a
              >
            </li>
          </ul>
          <button
            class="btn btn-login btn-sm"
            id="btnLoginPlaceholder"
            type="button"
          >
            Ingresar
          </button>
        </div>
      </div>
    </nav>
    <main class="flex-grow-1">
      <section class="container py-5" aria-labelledby="catalogo-titulo">
        <div class="section-heading mb-4">
          <div>
            <span class="eyebrow">Nuestros productos</span>
            <h1 class="fw-bold" id="catalogo-titulo">Catálogo</h1>
            <p class="text-secondary mb-0">
              Encontrá accesorios para estudiar, trabajar y crear.
            </p>
          </div>
          <span class="availability-note">Productos disponibles</span>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label" for="buscarProducto"
              >Buscar producto</label
            ><input
              class="form-control"
              type="search"
              id="buscarProducto"
              placeholder="Ejemplo: teclado o mouse"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label" for="filtroCategoria">Categoría</label
            ><select class="form-select" id="filtroCategoria">
              <option value="todas">Todas las categorías</option>
              <option value="Periféricos">Periféricos</option>
              <option value="Audio">Audio</option>
              <option value="Almacenamiento">Almacenamiento</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button
              class="btn btn-outline-primary w-100"
              id="limpiarFiltros"
              type="button"
            >
              Limpiar
            </button>
          </div>
        </div>
        <p class="text-secondary" id="cantidadResultados">
          4 productos encontrados
        </p>
        <div class="row g-4" id="lista-productos"></div>
      </section>
    </main>
    <footer class="footer py-4 mt-auto">
      <div class="container d-flex justify-content-between flex-wrap gap-2">
        <span>© 2026 Turing Store · Sprint 2</span
        ><span>Catálogo, detalle y carrito</span>
      </div>
    </footer>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="appToast" class="toast">
        <div class="toast-header">
          <strong class="me-auto">Turing Store</strong
          ><button
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Cerrar"
          ></button>
        </div>
        <div class="toast-body" id="toastMessage"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/productos.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/valoraciones.js"></script>
    <script src="../js/catalogo.js"></script>
    <script src="../js/base.js"></script>
  </body>
</html>
