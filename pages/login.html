<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />

    <title>Turing Store | Ingresar</title>
  </head>

  <body class="d-flex flex-column min-vh-100" data-page="login">
    <nav
      class="navbar navbar-expand-lg navbar-dark sticky-top"
      aria-label="Navegación principal"
    >
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <img class="brand-logo" src="../assets/logo-turing.svg" alt="" />
          <span>Turing Store</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Abrir menú de navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" data-page="inicio" href="../index.html">
                Inicio
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" data-page="catalogo" href="catalogo.html">
                Catálogo
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" data-page="carrito" href="carrito.html">
                Carrito
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="text-center mb-5">
          <span class="badge rounded-pill text-bg-warning mb-3">
            Área de usuarios
          </span>

          <h1>Accede a Turing Store</h1>

          <p class="lead">
            Inicia sesión o crea una cuenta para acceder a tu perfil.
          </p>
        </div>

        <div class="row g-4 justify-content-center">
          <div class="col-lg-5">
            <section class="card h-100 shadow-sm">
              <div class="card-body p-4">
                <h2 class="h4 mb-4">Iniciar sesión</h2>

                <form id="formIngreso">
                  <div class="mb-3">
                    <label for="correoIngreso" class="form-label">
                      Correo electrónico
                    </label>

                    <input
                      type="email"
                      class="form-control"
                      id="correoIngreso"
                      autocomplete="email"
                      required
                    />
                  </div>

                  <div class="mb-4">
                    <label for="claveIngreso" class="form-label">
                      Contraseña
                    </label>

                    <input
                      type="password"
                      class="form-control"
                      id="claveIngreso"
                      autocomplete="current-password"
                      required
                    />
                  </div>
                  <div class="text-end mb-3">
                    <button
                      class="btn btn-link p-0"
                      id="btnRecuperarClave"
                      type="button"
                    >
                      ¿Olvidaste tu contraseña?
                    </button>
                  </div>

                  <button class="btn btn-primary w-100" type="submit">
                    Ingresar
                  </button>
                </form>
              </div>
            </section>
          </div>

          <div class="col-lg-5">
            <section class="card h-100 shadow-sm">
              <div class="card-body p-4">
                <h2 class="h4 mb-4">Crear una cuenta</h2>

                <form id="formRegistro">
                  <div class="mb-3">
                    <label for="nombreRegistro" class="form-label">
                      Nombre
                    </label>

                    <input
                      type="text"
                      class="form-control"
                      id="nombreRegistro"
                      autocomplete="name"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="correoRegistro" class="form-label">
                      Correo electrónico
                    </label>

                    <input
                      type="email"
                      class="form-control"
                      id="correoRegistro"
                      autocomplete="email"
                      required
                    />
                  </div>

                  <div class="mb-4">
                    <label for="claveRegistro" class="form-label">
                      Contraseña
                    </label>

                    <input
                      type="password"
                      class="form-control"
                      id="claveRegistro"
                      minlength="6"
                      autocomplete="new-password"
                      required
                    />

                    <div class="form-text">
                      Debe tener como mínimo 6 caracteres.
                    </div>
                  </div>

                  <button class="btn btn-outline-primary w-100" type="submit">
                    Registrarme
                  </button>
                </form>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-auto">
      <div class="container d-flex justify-content-between flex-wrap gap-2">
        <span>© 2026 Turing Store</span>
        <span>Firebase Authentication</span>
      </div>
    </footer>

    <div
      class="toast-container position-fixed top-50 start-50 translate-middle p-3"
    >
      <div id="appToast" class="toast">
        <div class="toast-header">
          <strong class="me-auto">Turing Store</strong>

          <button
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Cerrar"
          ></button>
        </div>

        <div class="toast-body" id="toastMessage"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/base.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
