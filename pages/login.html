<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />

    <title>Turing Store | Ingresar</title>
  </head>

  <body class="d-flex flex-column min-vh-100" data-page="login">
    <nav
      class="navbar navbar-expand-lg navbar-dark sticky-top"
      aria-label="Navegación principal"
    >
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <img class="brand-logo" src="../assets/logo-turing.svg" alt="" />
          <span>Turing Store</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Abrir menú de navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" data-page="inicio" href="../index.html">
                Inicio
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" data-page="catalogo" href="catalogo.html">
                Catálogo
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" data-page="carrito" href="carrito.html">
                Carrito
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">
      <div class="container py-5">
        <div class="text-center mb-5">
          <span class="badge rounded-pill text-bg-warning mb-3">
            Área de usuarios
          </span>

          <h1>Accede a Turing Store</h1>

          <p class="lead">
            Inicia sesión o crea una cuenta para acceder a tu perfil.
          </p>
        </div>

        <div class="row g-4 justify-content-center">
          <div class="col-lg-5">
            <section class="card h-100 shadow-sm">
              <div class="card-body p-4">
                <h2 class="h4 mb-4">Iniciar sesión</h2>

                <form id="formIngreso">
                  <div class="mb-3">
                    <label for="correoIngreso" class="form-label">
                      Correo electrónico
                    </label>

                    <input
                      type="email"
                      class="form-control"
                      id="correoIngreso"
                      autocomplete="email"
                      required
                    />
                  </div>

                  <div class="mb-4">
                    <label for="claveIngreso" class="form-label">
                      Contraseña
                    </label>

                    <input
                      type="password"
                      class="form-control"
                      id="claveIngreso"
                      autocomplete="current-password"
                      required
                    />
                  </div>
                  <div class="text-end mb-3">
                    <button
                      class="btn btn-link p-0"
                      id="btnRecuperarClave"
                      type="button"
                    >
                      ¿Olvidaste tu contraseña?
                    </button>
                  </div>

                  <button class="btn btn-primary w-100" type="submit">
                    Ingresar
                  </button>
                </form>

                <div class="d-flex align-items-center my-4">
                  <hr class="flex-grow-1" />
                  <span class="px-3 text-secondary">o</span>
                  <hr class="flex-grow-1" />
                </div>

                <button
                  class="btn btn-outline-dark w-100"
                  id="btnGoogle"
                  type="button"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    class="me-2"
                    aria-hidden="true"
                  >
                    <path
                      fill="#4285F4"
                      d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.4Z"
                    />
                    <path
                      fill="#34A853"
                      d="M12 22c2.7 0 4.97-.9 6.62-2.42l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.05v2.62A10 10 0 0 0 12 22Z"
                    />
                    <path
                      fill="#FBBC05"
                      d="M6.39 13.87A6 6 0 0 1 6.08 12c0-.65.11-1.28.31-1.87V7.51H3.05A10 10 0 0 0 2 12c0 1.61.39 3.14 1.05 4.49l3.34-2.62Z"
                    />
                    <path
                      fill="#EA4335"
                      d="M12 6c1.47 0 2.79.51 3.83 1.5l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.95 5.51l3.34 2.62C7.18 7.76 9.39 6 12 6Z"
                    />
                  </svg>

                  Continuar con Google
                </button>
              </div>
            </section>
          </div>

          <div class="col-lg-5">
            <section class="card h-100 shadow-sm">
              <div class="card-body p-4">
                <h2 class="h4 mb-4">Crear una cuenta</h2>

                <form id="formRegistro">
                  <div class="mb-3">
                    <label for="nombreRegistro" class="form-label">
                      Nombre
                    </label>

                    <input
                      type="text"
                      class="form-control"
                      id="nombreRegistro"
                      autocomplete="name"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="correoRegistro" class="form-label">
                      Correo electrónico
                    </label>

                    <input
                      type="email"
                      class="form-control"
                      id="correoRegistro"
                      autocomplete="email"
                      required
                    />
                  </div>

                  <div class="mb-4">
                    <label for="claveRegistro" class="form-label">
                      Contraseña
                    </label>

                    <input
                      type="password"
                      class="form-control"
                      id="claveRegistro"
                      minlength="6"
                      autocomplete="new-password"
                      required
                    />

                    <div class="form-text">
                      Debe tener como mínimo 6 caracteres.
                    </div>
                  </div>

                  <button class="btn btn-outline-primary w-100" type="submit">
                    Registrarme
                  </button>
                </form>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-auto">
      <div class="container d-flex justify-content-between flex-wrap gap-2">
        <span>© 2026 Turing Store</span>
        <span>Firebase Authentication</span>
      </div>
    </footer>

    <div
      class="toast-container position-fixed top-50 start-50 translate-middle p-3"
    >
      <div id="appToast" class="toast">
        <div class="toast-header">
          <strong class="me-auto">Turing Store</strong>

          <button
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Cerrar"
          ></button>
        </div>

        <div class="toast-body" id="toastMessage"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/base.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
